tracks:
  - name: stable
    baseImage: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    upstream:
      datasource: github-releases
      depName: Sonarr/Sonarr
      version: "4.0.20.3014"
    githubRelease:
      tag: "v${version}"
      assets:
        amd64: "Sonarr.main.${version}.linux-musl-x64.tar.gz"
        arm64: "Sonarr.main.${version}.linux-musl-arm64.tar.gz"
    tags:
      - "${version}"
      - "${major}"
      - "${major}.${minor}"
      - latest

  - name: prerelease
    baseImage: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    upstream:
      datasource: github-releases
      depName: Sonarr/Sonarr
      version: "5.0.0.2668"
    prerelease: true
    githubRelease:
      tag: "v${version}"
      assets:
        amd64: "Sonarr.develop.${version}.linux-musl-x64.tar.gz"
        arm64: "Sonarr.develop.${version}.linux-musl-arm64.tar.gz"
    tags:
      - "${version}-prerelease"
      - "${major}-prerelease"
      - "${major}.${minor}-prerelease"
