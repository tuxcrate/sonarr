name: Container

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    permissions:
      contents: write
      packages: write
      pull-requests: write
    uses: tuxcrate/github-actions/.github/workflows/container.yml@main
    with:
      shared-ref: main
      docs-repository: tuxcrate/docs
    secrets:
      docs-token: ${{ secrets.DOCS_TOKEN }}
