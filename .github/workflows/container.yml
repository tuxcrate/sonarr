name: Container

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    permissions:
      contents: write
      packages: write
      pull-requests: write
    # Validate the new hook before the shared workflow is merged into main.
    uses: tuxcrate/github-actions/.github/workflows/container.yml@ab68db489d950744495ac6bc8c4d665960555bf3
    with:
      shared-ref: ab68db489d950744495ac6bc8c4d665960555bf3
    secrets: inherit
