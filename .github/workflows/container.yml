name: Container

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    permissions:
      contents: write
      packages: write
      pull-requests: write
    # Validate the new hook before the shared workflow is merged into main.
    uses: tuxcrate/github-actions/.github/workflows/container.yml@865e02eb58a02feaa7280bb5876536c2762a5531
    with:
      shared-ref: 865e02eb58a02feaa7280bb5876536c2762a5531
    secrets: inherit
